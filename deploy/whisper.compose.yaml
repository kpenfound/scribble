services:
  whisper:
    image: ghcr.io/speaches-ai/speaches:latest-cuda
    restart: unless-stopped
    ports:
      # Loopback by default. Set WHISPER_BIND to this host's tailnet address
      # (`tailscale ip -4`) so the scribble host can reach it over the tailnet.
      - "${WHISPER_BIND:-127.0.0.1}:8000:8000"
    volumes:
      - whisper-models:/home/ubuntu/.cache/huggingface/hub
    environment:
      WHISPER__INFERENCE_DEVICE: cuda
      WHISPER__COMPUTE_TYPE: float16
      STT_MODEL_TTL: "-1"
      PRELOAD_MODELS: '["deepdml/faster-whisper-large-v3-turbo-ct2"]'
      ENABLE_UI: "false"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
volumes:
  whisper-models:
