<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f6f3">
  <meta name="description" content="Your scribe for random thoughts. Capture now, find it in Obsidian.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
  <title>Scribble</title>
</head>
<body>
  <header><a class="brand" href="/" aria-label="Scribble home"><span aria-hidden="true">✎</span> scribble</a><span id="connection" role="status">Connecting…</span></header>
  <main>
    <div class="intro"><p class="eyebrow">A little space for a passing thought</p><h1>Get it out of your head.</h1><p>Drop a thought here. Find it in your daily note.</p></div>
    <form id="capture">
      <label for="thought">What's on your mind?</label>
      <textarea id="thought" name="thought" placeholder="An idea, a reminder, a loose thread…" rows="5" maxlength="16000" required></textarea>
      <div class="capture-actions"><button type="button" id="record" class="secondary" aria-pressed="false"><span aria-hidden="true">●</span> Record a thought</button><button type="submit" id="send">Scribble <span aria-hidden="true">↗</span></button></div>
    </form>
    <p id="hint" class="hint">Just capture. Obsidian keeps the rest.</p>
    <p id="notice" role="alert" hidden></p>
    <p id="outbox" class="hint" role="status" hidden></p>
    <section id="confirmation" aria-live="polite" aria-atomic="true" hidden>
      <div class="card-heading"><h2 id="action"></h2><time id="written-time"></time></div>
      <p id="previous" hidden></p><p id="result"></p><p id="job-error" hidden></p>
      <div class="card-actions"><button type="button" id="undo" class="quiet" hidden>Undo</button><button type="button" id="retry" class="quiet" hidden>Try again</button></div>
    </section>
    <section id="failures" hidden><h2>Needs attention</h2><ul id="failure-list"></ul></section>
  </main>
  <footer>One thought at a time.</footer>
</body>
</html>
