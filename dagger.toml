# Dagger v1 workspace; run `dagger check` for the full suite.
[modules.go]
source = "github.com/dagger/go@v0.2.0"

[modules.go.settings]
base = "golang:1.26-bookworm"
goflags = "-race -count=1"
# `dagger generate` runs go:generate here; it writes docs/openapi.json and the
# generator's stale check fails when the committed copy differs.
generate = ["internal/openapi"]

[modules.staticcheck]
source = "github.com/dagger/go/staticcheck@v0.2.0"

[modules.dang-sdk]
source = "dagger.io/sdk/dang"

[sdks.dang]
module = "dang-sdk"

[modules.scribble]
source = ".dagger/modules/scribble"
main = true

[sdks.dang.scopes.".dagger/modules/scribble"]
is-module = true
name = "scribble"

[modules.playwright]
source = "github.com/dagger/playwright@46d33ab10fa9e8ca43d782aa496a41760eadf7b3"

[modules.playwright.settings]
baseCtr = "dag://scribble/browser-runtime"
setup = ["npm run build"]
